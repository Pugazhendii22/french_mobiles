name: french_mobiles
description: French Mobiles buyback app - converted from HTML/Tailwind to Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.0
  firebase_core: ^3.6.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  palette_generator: ^0.3.3
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  image_picker: ^0.8.7
  http: ^1.6.0
  share_plus: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

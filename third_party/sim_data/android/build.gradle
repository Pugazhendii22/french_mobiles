group 'com.vincentkammerer.sim_data'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.vincentkammerer.sim_data'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 23
    }
}